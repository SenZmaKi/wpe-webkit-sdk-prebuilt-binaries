name: Build WPE WebKit SDK

on:
  workflow_dispatch:
    inputs:
      webkit_version:
        description: WPE WebKit version supported by flutter_inappwebview_linux
        required: true
        default: "2.50.4"
        type: string
      libwpe_version:
        description: Matching libwpe version supported by flutter_inappwebview_linux
        required: true
        default: "1.16.3"
        type: string
      release_tag:
        description: Prerelease tag that receives the SDK assets
        required: true
        default: "wpe-sdk-2.50.4"
        type: string
      build_jobs:
        description: Parallel compiler jobs per architecture (1-2 recommended)
        required: true
        default: "2"
        type: string

permissions:
  contents: write

concurrency:
  group: build-wpe-sdk-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.architecture }} SDK
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      WEBKIT_VERSION: ${{ inputs.webkit_version }}
      LIBWPE_VERSION: ${{ inputs.libwpe_version }}
      BUILD_JOBS: ${{ inputs.build_jobs }}
      ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WEBKIT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$LIBWPE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_JOBS" =~ ^[1-9][0-9]*$ ]]
          (( BUILD_JOBS <= 2 )) || { echo 'build_jobs must be at most 2' >&2; exit 64; }

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: wpe-${{ runner.os }}-${{ matrix.architecture }}-${{ inputs.webkit_version }}-${{ inputs.libwpe_version }}-${{ github.sha }}
          restore-keys: |
            wpe-${{ runner.os }}-${{ matrix.architecture }}-${{ inputs.webkit_version }}-${{ inputs.libwpe_version }}-

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bison bubblewrap build-essential ccache cmake file flex gperf ninja-build pax-utils pkg-config python3 ruby ruby-dev unifdef \
            libatk-bridge2.0-dev libatk1.0-dev libavif-dev libegl1-mesa-dev libenchant-2-dev libepoxy-dev \
            libfontconfig1-dev libfreetype6-dev libgcrypt20-dev libglib2.0-dev \
            libharfbuzz-dev libharfbuzz-icu0 libhyphen-dev libicu-dev libjpeg-dev \
            libjxl-dev liblcms2-dev libopenjp2-7-dev libpng-dev libpsl-dev libsecret-1-dev libsoup-3.0-dev \
            libsqlite3-dev libssl-dev libtasn1-6-dev libunwind-dev libwayland-dev libwebp-dev libwoff-dev \
            libxkbcommon-dev libxml2-dev libxslt1-dev libzstd-dev wayland-protocols

      - name: Configure compiler cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/ccache
          ccache --set-config=base_dir="$RUNNER_TEMP"
          ccache --set-config=compiler_check=content
          ccache --set-config=compression=true
          ccache --set-config=max_size=4G
          ccache --show-config

      - name: Download source releases
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/wpe-source"
          mkdir -p "$source_dir"
          curl --fail --location --retry 4 --retry-all-errors "https://wpewebkit.org/releases/libwpe-${LIBWPE_VERSION}.tar.xz" --output "$source_dir/libwpe.tar.xz"
          curl --fail --location --retry 4 --retry-all-errors "https://wpewebkit.org/releases/wpewebkit-${WEBKIT_VERSION}.tar.xz" --output "$source_dir/wpewebkit.tar.xz"
          tar -xJf "$source_dir/libwpe.tar.xz" -C "$source_dir"
          tar -xJf "$source_dir/wpewebkit.tar.xz" -C "$source_dir"

      - name: Build and install libwpe
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wpe-source/libwpe-${LIBWPE_VERSION}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build build --parallel "$BUILD_JOBS"
          sudo cmake --install build
          sudo ldconfig
          pkg-config --modversion wpe-1.0

      - name: Configure WPE WebKit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wpe-source/wpewebkit-${WEBKIT_VERSION}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DPORT=WPE \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_DOCUMENTATION=OFF -DENABLE_INTROSPECTION=OFF \
            -DENABLE_BUBBLEWRAP_SANDBOX=OFF -DENABLE_WEBDRIVER=OFF -DENABLE_MINIBROWSER=OFF \
            -DENABLE_SPEECH_SYNTHESIS=OFF -DENABLE_WEB_AUDIO=OFF \
            -DENABLE_VIDEO=OFF -DENABLE_WEBGL=OFF -DENABLE_GPU_PROCESS=OFF \
            -DENABLE_MEDIA_SOURCE=OFF -DENABLE_MEDIA_STREAM=OFF -DENABLE_MEDIA_RECORDER=OFF \
            -DENABLE_MEDIA_SESSION=OFF -DENABLE_WEB_CODECS=OFF -DENABLE_ENCRYPTED_MEDIA=OFF \
            -DENABLE_OFFSCREEN_CANVAS=OFF -DENABLE_OFFSCREEN_CANVAS_IN_WORKERS=OFF \
            -DENABLE_JOURNALD_LOG=OFF -DENABLE_GAMEPAD=OFF \
            -DENABLE_WPE_PLATFORM=ON -DENABLE_WPE_PLATFORM_HEADLESS=ON \
            -DENABLE_WPE_PLATFORM_DRM=OFF -DENABLE_WPE_PLATFORM_WAYLAND=OFF \
            -DUSE_GBM=OFF -DUSE_LIBDRM=OFF \
            -DUSE_AVIF=OFF -DUSE_WOFF2=OFF -DUSE_JPEGXL=OFF -DUSE_LCMS=OFF -DUSE_ATK=OFF \
            -DUSE_LIBBACKTRACE=OFF

      - name: Compile WPE WebKit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wpe-source/wpewebkit-${WEBKIT_VERSION}"
          cmake --build build --parallel "$BUILD_JOBS"
          ccache --show-stats

      - name: Save compiler cache
        if: ${{ steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Install WPE WebKit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wpe-source/wpewebkit-${WEBKIT_VERSION}"
          sudo cmake --install build
          sudo ldconfig
          test "$(pkg-config --modversion wpe-webkit-2.0)" = "$WEBKIT_VERSION"

      - name: Package SDK and runtime
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/sdk-root"
          runtime_root="$RUNNER_TEMP/runtime-root"
          release_dir="$GITHUB_WORKSPACE/release-assets"
          # The WebKit build tree is substantially larger than the installed
          # SDK. Remove it before creating the compressed release archive so
          # the hosted runner has enough free workspace for the archive.
          rm -rf "$RUNNER_TEMP/wpe-source"
          sudo apt-get clean
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          sdk_archive="Senpwai-WPE-SDK-${WEBKIT_VERSION}-linux-${ARCHITECTURE}.tar.xz"
          runtime_archive="Senpwai-WPE-Runtime-${WEBKIT_VERSION}-linux-${ARCHITECTURE}.tar.xz"
          mkdir -p \
            "$sdk_root/usr/local/include" "$sdk_root/usr/local/lib" \
            "$runtime_root/usr/local/lib" "$runtime_root/usr/local/libexec" "$runtime_root/usr/local/share" \
            "$release_dir"
          cp -a /usr/local/include/wpe-1.0 /usr/local/include/wpe-webkit-2.0 "$sdk_root/usr/local/include/"
          while IFS= read -r -d '' file; do
            relative="${file#/usr/local/}"
            mkdir -p "$sdk_root/usr/local/$(dirname "$relative")"
            cp -a "$file" "$sdk_root/usr/local/$relative"
            if [[ "$file" != *.pc ]]; then
              mkdir -p "$runtime_root/usr/local/$(dirname "$relative")"
              cp -a "$file" "$runtime_root/usr/local/$relative"
            fi
          done < <(find /usr/local/lib \( -type f -o -type l \) \( -name 'libWPEWebKit*' -o -name 'libwpe*' -o -name 'wpe*.pc' \) -print0)
          cp -a /usr/local/libexec/wpe-webkit-2.0 "$runtime_root/usr/local/libexec/"
          cp -a /usr/local/share/wpe-webkit-2.0 "$runtime_root/usr/local/share/"
          "$GITHUB_WORKSPACE/scripts/collect-runtime-dependencies.sh" "$runtime_root"
          find "$runtime_root" -type f -exec sh -c 'file -b "$1" | grep -q ELF && strip --strip-unneeded "$1" || true' _ {} \;
          for archive in "$sdk_archive" "$runtime_archive"; do
            root="$sdk_root"
            [[ "$archive" == "$runtime_archive" ]] && root="$runtime_root"
            tar -C "$root" -cJf "$release_dir/$archive" usr
            (cd "$release_dir" && sha256sum "$archive" > "$archive.sha256")
            jq -n --arg webkitVersion "$WEBKIT_VERSION" --arg libwpeVersion "$LIBWPE_VERSION" --arg architecture "$ARCHITECTURE" \
              --arg kind "$([[ "$archive" == "$sdk_archive" ]] && printf sdk || printf runtime)" \
              '{kind: $kind, webkitVersion: $webkitVersion, libwpeVersion: $libwpeVersion, architecture: $architecture, installPrefix: "/usr/local", featureProfile: "headless-no-media-no-webgl", runtimeDependencyPolicy: "recursive-appimage-excludelist"}' \
              > "$release_dir/$archive.metadata.json"
          done
          tar -tJf "$release_dir/$sdk_archive" > "$RUNNER_TEMP/sdk-archive.list"
          tar -tJf "$release_dir/$runtime_archive" > "$RUNNER_TEMP/runtime-archive.list"
          grep -q '/wpe-webkit-2.0\.pc' "$RUNNER_TEMP/sdk-archive.list"
          grep -q '/libWPEWebKit-2.0\.so' "$RUNNER_TEMP/runtime-archive.list"
          grep -q '/WPEWebProcess' "$RUNNER_TEMP/runtime-archive.list"
          grep -q '/libicui18n\.so' "$RUNNER_TEMP/runtime-archive.list"
          grep -q '/libicuuc\.so' "$RUNNER_TEMP/runtime-archive.list"
          grep -q '/libicudata\.so' "$RUNNER_TEMP/runtime-archive.list"
          grep -q '/libxml2\.so' "$RUNNER_TEMP/runtime-archive.list"
          grep -q '/wpe-webkit-runtime/bundled-libraries\.txt' "$RUNNER_TEMP/runtime-archive.list"
          grep -q '/wpe-webkit-runtime/host-libraries\.txt' "$RUNNER_TEMP/runtime-archive.list"
          ! grep -Eq '/lib(glib-2\.0|gio-2\.0|gmodule-2\.0|gobject-2\.0|secret-1|gtk-3|gdk-3|pango-1\.0|cairo|mount|blkid|ffi|pcre2-8|selinux)\.so' \
            "$RUNNER_TEMP/runtime-archive.list"

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: wpe-sdk-${{ inputs.webkit_version }}-${{ matrix.architecture }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish SDK prerelease
    needs: build
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      WEBKIT_VERSION: ${{ inputs.webkit_version }}
      LIBWPE_VERSION: ${{ inputs.libwpe_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download SDK assets
        uses: actions/download-artifact@v4
        with:
          pattern: wpe-sdk-${{ inputs.webkit_version }}-*
          path: release-assets
          merge-multiple: true

      - name: Publish prerelease assets
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "WPE WebKit SDK $WEBKIT_VERSION" \
              --notes "flutter_inappwebview_linux baseline: WPE WebKit $WEBKIT_VERSION and libwpe $LIBWPE_VERSION. Native x86_64 and aarch64 SDK/runtime archives."
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
